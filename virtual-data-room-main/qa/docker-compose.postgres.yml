name: vdr-qa-isolated
services:
  postgres-qa:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vdr_qa_test
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - vdr_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qa -d vdr_qa_test']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  vdr_qa_pgdata:
